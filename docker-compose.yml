services:
  db:
    image: postgres:16-alpine
    container_name: skripsi-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: pesantren
    ports:
      - "55432:5432"
    volumes:
      - skripsi-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d pesantren"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: skripsi-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dev:devpass@db:5432/pesantren?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  skripsi-pg-data:
